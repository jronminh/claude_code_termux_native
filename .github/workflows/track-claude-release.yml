name: Track Claude Code releases

# Detects when Anthropic ships a new linux-arm64 Claude Code build and
# creates a GitHub Release for it on this repo, so watchers/subscribers
# get pinged instead of having to poll downloads.claude.ai themselves.
#
# Deliberately schedule/workflow_dispatch only — NEVER add a
# pull_request/pull_request_target trigger to this workflow. This repo is
# public, and GitHub explicitly warns against self-hosted runners on
# public repos for that reason; this workflow uses a GitHub-hosted runner
# instead (no such risk), but keep the trigger list narrow regardless so
# it never becomes a vector if a runner choice changes later.
#
# What this DOES verify: the binary downloads, its SHA-256 matches
# Anthropic's own manifest, `--version` runs successfully on real arm64
# glibc Linux (GitHub's ubuntu-24.04-arm runner), AND it runs against
# Termux's own currently-shipped glibc build specifically (downloaded
# fresh from Termux's own apt repo each run, extracted, never installed
# system-wide or retained past the job) — so a Termux glibc-repo
# regression that would break this repo's patched install gets caught
# here too, not just a broken Anthropic build. Nothing about Anthropic's
# binary is ever redistributed by this workflow: it's downloaded fresh
# from Anthropic's own CDN, tested in the job, and discarded when the job
# ends — the release this creates carries notes and a version tag only,
# never a copy of the binary itself (see README "License": the binary
# remains Anthropic's, this project never ships/hosts a copy of it).
#
# What this still does NOT verify: anything kernel-level (the
# epoll_pwait2 trap documented in README "Troubleshooting" #9, or any
# other real-Android-kernel-specific quirk). A GitHub-hosted runner always
# runs a real Linux kernel, never a real Android/Bionic kernel, no matter
# whose glibc build sits on top of it — see
# notes/planned-features-and-seo.md for why a self-hosted runner (the only
# thing that could close this gap) was considered and set aside.

"on":
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest stable version
        id: ver
        run: |
          set -euo pipefail
          VER=$(curl -fsSL https://downloads.claude.ai/claude-code-releases/stable | tr -d '[:space:]')
          if [ -z "$VER" ]; then
            echo "empty version from stable endpoint" >&2
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Check if this version already has a release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "claude-${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=1" >> "$GITHUB_OUTPUT"
          else
            echo "exists=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Download, verify, and smoke-test the binary
        if: steps.check.outputs.exists == '0'
        id: smoke
        run: |
          set -euo pipefail
          BASE=https://downloads.claude.ai/claude-code-releases
          VER="${{ steps.ver.outputs.version }}"

          curl -fSL -o manifest.json "$BASE/$VER/manifest.json"
          curl -fSL -o claude "$BASE/$VER/linux-arm64/claude"

          EXP=$(jq -r '.platforms["linux-arm64"].checksum' manifest.json)
          ACTUAL=$(sha256sum claude | awk '{print $1}')
          if [ -z "$EXP" ] || [ "$EXP" = "null" ] || [ "$EXP" != "$ACTUAL" ]; then
            echo "checksum mismatch or unreadable: expected '$EXP', got '$ACTUAL'" >&2
            exit 1
          fi

          chmod +x claude
          VER_OUT=$(./claude --version)
          echo "binary reports: $VER_OUT"

          {
            echo "commit=$(jq -r '.commit' manifest.json)"
            echo "build_date=$(jq -r '.buildDate' manifest.json)"
            echo "reported_version<<VEROUT_EOF"
            echo "$VER_OUT"
            echo "VEROUT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify against Termux's real glibc build
        if: steps.check.outputs.exists == '0'
        id: termux_glibc
        run: |
          set -euo pipefail
          GLIBC_REPO=https://packages-cf.termux.dev/apt/termux-glibc

          # Written to a file rather than piped into awk: an early
          # `exit` inside a pipeline reader closes the pipe while curl is
          # still writing, and under `pipefail` that SIGPIPE turns into a
          # hard failure of this whole step — writing to a file first
          # avoids that entirely.
          curl -fsSL -o packages.txt "$GLIBC_REPO/dists/glibc/stable/binary-aarch64/Packages"
          PKG_BLOCK=$(awk '/^Package: glibc$/{p=1} p{print} p && /^$/{p=0}' packages.txt)
          FILENAME=$(printf '%s\n' "$PKG_BLOCK" | sed -n 's/^Filename: //p')
          GLIBC_VER=$(printf '%s\n' "$PKG_BLOCK" | sed -n 's/^Version: //p')
          if [ -z "$FILENAME" ] || [ -z "$GLIBC_VER" ]; then
            echo "could not find the glibc package entry in Termux's Packages index — repo layout may have changed" >&2
            exit 1
          fi

          # Downloaded fresh every run, extracted to a scratch dir, never
          # installed system-wide or retained past this job — this is
          # Termux's own glibc-repo package, not Anthropic's binary, so
          # there's no redistribution concern here either.
          curl -fSL -o termux-glibc.deb "$GLIBC_REPO/$FILENAME"
          mkdir -p termux-root
          dpkg -x termux-glibc.deb termux-root

          TERMUX_LD=$(find termux-root -name 'ld-linux-aarch64.so.1' -print -quit)
          if [ -z "$TERMUX_LD" ]; then
            echo "ld-linux-aarch64.so.1 not found inside Termux's glibc package — package layout may have changed" >&2
            exit 1
          fi
          LIBDIR=$(dirname "$TERMUX_LD")

          # Invoke the loader directly (same pattern scripts/update.sh
          # uses for its own version check) instead of patchelf +
          # kernel-loading the binary — this doesn't depend on an
          # ld.so.cache existing for a freshly dpkg -x'd tree, and tests
          # the same underlying question: does Termux's actual shipped
          # glibc load and run this binary correctly.
          TERMUX_VER_OUT=$("$TERMUX_LD" --library-path "$LIBDIR" ./claude --version)
          echo "against Termux glibc $GLIBC_VER: $TERMUX_VER_OUT"

          {
            echo "termux_glibc_version=$GLIBC_VER"
            echo "termux_reported_version<<VEROUT_EOF"
            echo "$TERMUX_VER_OUT"
            echo "VEROUT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create the release
        if: steps.check.outputs.exists == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          gh release create "claude-$VER" \
            --title "claude $VER" \
            --notes "Detected new Claude Code release **$VER** (commit \`${{ steps.smoke.outputs.commit }}\`, built ${{ steps.smoke.outputs.build_date }}).

          Smoke-tested on a GitHub-hosted \`ubuntu-24.04-arm\` runner: the \`linux-arm64\` binary downloaded, its SHA-256 matched Anthropic's manifest, and \`--version\` ran successfully (reported: \`${{ steps.smoke.outputs.reported_version }}\`) — directly on real arm64 glibc Linux, no patching needed for that.

          Also re-verified against Termux's own currently-shipped \`glibc\` package (v${{ steps.termux_glibc.outputs.termux_glibc_version }}, downloaded fresh from Termux's own apt repo for this check, never retained): \`--version\` via that loader reported \`${{ steps.termux_glibc.outputs.termux_reported_version }}\`. This is a reasonable signal the patched install path will keep working, not a guarantee.

          **This does not verify it works on Termux/Android (Bionic) end to end.** A GitHub-hosted runner always runs a real Linux kernel, never a real Android kernel — it can't catch anything kernel-level, like the epoll_pwait2 trap (see README \"Troubleshooting\" #9). Run \`termux-update-claude\` yourself and open an issue if something still breaks on-device.

          No Anthropic binary is redistributed by this release — only these notes and a version tag."
