name: Track Claude Code releases

# Detects when Anthropic ships a new linux-arm64 Claude Code build, or
# when Termux's own glibc package changes under an already-released
# build, and publishes/updates a GitHub Release accordingly.
#
# Deliberately schedule/workflow_dispatch only — NEVER add a
# pull_request/pull_request_target trigger. This repo is public, and
# GitHub explicitly warns against self-hosted runners on public repos for
# that reason; this workflow uses a GitHub-hosted runner instead, but
# keep the trigger list narrow regardless in case that ever changes.
#
# Verifies: SHA-256 against Anthropic's manifest, `--version` on generic
# arm64 glibc (GitHub's ubuntu-24.04-arm runner), and `--version` against
# Termux's own currently-shipped glibc (downloaded fresh from Termux's
# apt repo, extracted, never retained). Does NOT verify anything
# kernel-level (e.g. the epoll_pwait2 trap, README "Troubleshooting" #9)
# — no GitHub-hosted runner runs a real Android kernel. No Anthropic
# binary is ever redistributed — downloaded fresh, tested, discarded.
# See notes/planned-features-and-seo.md for the self-hosted-runner
# tradeoff this design avoids.

"on":
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest stable claude version
        id: ver
        run: |
          set -euo pipefail
          VER=$(curl -fsSL https://downloads.claude.ai/claude-code-releases/stable | tr -d '[:space:]')
          if [ -z "$VER" ]; then
            echo "empty version from stable endpoint" >&2
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Resolve Termux's current glibc package version
        id: termux_ver
        run: |
          set -euo pipefail
          GLIBC_REPO=https://packages-cf.termux.dev/apt/termux-glibc
          curl -fsSL -o packages.txt "$GLIBC_REPO/dists/glibc/stable/binary-aarch64/Packages"
          PKG_BLOCK=$(awk '/^Package: glibc$/{p=1} p{print} p && /^$/{p=0}' packages.txt)
          FILENAME=$(printf '%s\n' "$PKG_BLOCK" | sed -n 's/^Filename: //p')
          GLIBC_VER=$(printf '%s\n' "$PKG_BLOCK" | sed -n 's/^Version: //p')
          if [ -z "$FILENAME" ] || [ -z "$GLIBC_VER" ]; then
            echo "could not resolve Termux's glibc package version" >&2
            exit 1
          fi
          echo "version=$GLIBC_VER" >> "$GITHUB_OUTPUT"
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"

      # A release's notes carry a trailing `<!-- termux_glibc=X -->`
      # marker recording which glibc version it was last verified
      # against. Re-verification is triggered by EITHER a new claude
      # version OR that marker no longer matching the current glibc
      # version — so a Termux glibc update alone (independent of claude
      # ever changing) still gets caught, not just a new claude release.
      - name: Check existing release + whether re-verification is needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="claude-${{ steps.ver.outputs.version }}"
          if BODY=$(gh release view "$TAG" --json body --jq .body 2>/dev/null); then
            echo "exists=1" >> "$GITHUB_OUTPUT"
            LAST_GLIBC=$(printf '%s' "$BODY" | sed -n 's/.*<!-- termux_glibc=\([^ ]*\) -->.*/\1/p')
          else
            echo "exists=0" >> "$GITHUB_OUTPUT"
            LAST_GLIBC=""
          fi
          if [ "$LAST_GLIBC" = "${{ steps.termux_ver.outputs.version }}" ]; then
            echo "run_full=0" >> "$GITHUB_OUTPUT"
          else
            echo "run_full=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Download, verify, and smoke-test the binary
        if: steps.check.outputs.run_full == '1'
        id: smoke
        run: |
          set -euo pipefail
          BASE=https://downloads.claude.ai/claude-code-releases
          VER="${{ steps.ver.outputs.version }}"

          curl -fSL -o manifest.json "$BASE/$VER/manifest.json"
          curl -fSL -o claude "$BASE/$VER/linux-arm64/claude"

          EXP=$(jq -r '.platforms["linux-arm64"].checksum' manifest.json)
          ACTUAL=$(sha256sum claude | awk '{print $1}')
          if [ -z "$EXP" ] || [ "$EXP" = "null" ] || [ "$EXP" != "$ACTUAL" ]; then
            echo "checksum mismatch or unreadable: expected '$EXP', got '$ACTUAL'" >&2
            exit 1
          fi

          chmod +x claude
          VER_OUT=$(./claude --version)

          {
            echo "commit=$(jq -r '.commit' manifest.json)"
            echo "build_date=$(jq -r '.buildDate' manifest.json)"
            echo "reported_version<<VEROUT_EOF"
            echo "$VER_OUT"
            echo "VEROUT_EOF"
          } >> "$GITHUB_OUTPUT"

      # continue-on-error: a failure here (Termux's glibc no longer runs
      # this claude build) must not stop the job — the next step still
      # needs to run to flag it on an already-published release.
      - name: Verify against Termux's real glibc build
        if: steps.check.outputs.run_full == '1'
        id: termux_glibc
        continue-on-error: true
        run: |
          set -euo pipefail
          GLIBC_REPO=https://packages-cf.termux.dev/apt/termux-glibc
          curl -fSL -o termux-glibc.deb "$GLIBC_REPO/${{ steps.termux_ver.outputs.filename }}"
          mkdir -p termux-root
          dpkg -x termux-glibc.deb termux-root

          TERMUX_LD=$(find termux-root -name 'ld-linux-aarch64.so.1' -print -quit)
          if [ -z "$TERMUX_LD" ]; then
            echo "ld-linux-aarch64.so.1 not found inside Termux's glibc package — layout may have changed" >&2
            exit 1
          fi
          LIBDIR=$(dirname "$TERMUX_LD")

          # Invoke the loader directly (same pattern scripts/update.sh
          # uses for its own version check) rather than patchelf +
          # kernel-loading — no ld.so.cache needed for a freshly dpkg
          # -x'd tree, and it tests the same underlying question: does
          # Termux's actual shipped glibc load and run this binary.
          "$TERMUX_LD" --library-path "$LIBDIR" ./claude --version

      - name: Publish or update the release
        if: steps.check.outputs.run_full == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          TAG="claude-$VER"
          GLIBC_VER="${{ steps.termux_ver.outputs.version }}"

          if [ "${{ steps.termux_glibc.outcome }}" = "success" ]; then
            NOTES="Claude Code $VER — commit \`${{ steps.smoke.outputs.commit }}\`, built ${{ steps.smoke.outputs.build_date }}

          - SHA-256 verified against Anthropic's manifest
          - Runs on generic arm64 glibc (Ubuntu) and Termux glibc $GLIBC_VER
          - Not verified: on-device Bionic/Termux kernel behavior (README \"Troubleshooting\" #9)

          <!-- termux_glibc=$GLIBC_VER -->"
          else
            NOTES="⚠️ Termux glibc $GLIBC_VER broke this build (\`--version\` failed) — investigate before running \`termux-update-claude\`.

          <!-- termux_glibc=$GLIBC_VER -->"
          fi

          if [ "${{ steps.check.outputs.exists }}" = "1" ]; then
            gh release edit "$TAG" --notes "$NOTES"
          else
            if [ "${{ steps.termux_glibc.outcome }}" = "success" ]; then
              gh release create "$TAG" --title "claude $VER" --notes "$NOTES"
            else
              echo "first-time verification failed — not publishing a release for $VER" >&2
              exit 1
            fi
          fi
